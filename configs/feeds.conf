# dl12345/mwan3 nftables 移植版：仓库根即包根，OpenWrt feed 扫描器（include/scan.mk 的
# FILELIST sed 管道）处理不了根级包会丢弃整个 feed，故由 prepare_luci_feeds.sh 克隆后
# 重嵌套进子目录，再以 src-link 引入。必须置于 packages 之前以覆盖官方 mwan3。
src-link mwan3nft vendor/mwan3nft
src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
src-git packages https://git.openwrt.org/feed/packages.git^db09fc6eebf41ba0498c73e8c9c6df9088d79435
src-git luci https://git.openwrt.org/project/luci.git^86d1549227ffef9cf60418583b7b4b9b0b06bc08
