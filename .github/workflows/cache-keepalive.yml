name: Cache keepalive

# GitHub deletes a cache entry after 7 days without access. This job restores
# (never saves) the toolchain cache once a week so it stays alive between
# releases - otherwise a quiet week silently throws away the 760 MB archive
# and the next build starts from scratch.
#
# The key must stay in sync with the one in build-release.yml, otherwise the
# restore falls through to restore-keys and may pick an older entry.

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: |
            sources/openwrt/staging_dir
            sources/openwrt/build_dir/host
          key: openwrt-toolchain-${{ runner.os }}-${{ hashFiles('port/sources.lock.json', 'configs/*.config', 'port/overlay/target/linux/rtl9617c/config-6.18') }}
          restore-keys: |
            openwrt-toolchain-${{ runner.os }}-

      - name: Report
        run: |
          echo "cache-hit: ${{ steps.restore.outputs.cache-hit }}"
          du -sh sources/openwrt/staging_dir 2>/dev/null || echo "staging_dir not restored"
