name: build-ubi-config

# Builds a UBIFS image for the PT1570-R10 ubi_Config volume.
#
# The config files contain this unit's MAC / serial number / radio calibration,
# so they are NOT committed. They are supplied through the repository secret
# UBI_CONFIG_B64, which holds a base64 of the whole volume:
#
#   tar cf - -C <ubi_Config dir> . | xz -6 | base64 -w0
#
# All 12 files must be included, not just config.xml / config_hs.xml: the stock
# firmware also reads dev_info.cfg, omci_mib.cfg, scfg.txt and default_scfg.txt,
# and a volume missing them would break a stock-slot boot. xz keeps the whole
# tree at ~23 KB so it fits in the 64 KB secret limit (gzip needed 49 KB).
#
# Geometry comes from the unit (ubireader display-info on the full dump):
#   PEB 131072, LEB 126976, volume reserved 83 PEB.

on:
  workflow_dispatch:
    inputs:
      max_leb:
        description: 'Max LEB count (-c); volume reserves 83 PEB on this unit'
        required: false
        default: '84'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mtd-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y mtd-utils

      - name: Unpack config from secret
        env:
          UBI_CONFIG_B64: ${{ secrets.UBI_CONFIG_B64 }}
        run: |
          if [ -z "$UBI_CONFIG_B64" ]; then
            echo "::error::secret UBI_CONFIG_B64 is empty"
            exit 1
          fi
          mkdir -p config-tree
          printf '%s' "$UBI_CONFIG_B64" | base64 -d | xz -d | tar x -C config-tree
          echo "--- unpacked ---"
          ls -l config-tree
          # All files the stock firmware expects must be present.
          for f in config.xml config_hs.xml config_bak.xml config_hs_bak.xml \
                   dev_info.cfg omci_mib.cfg omci_custom_opt.conf \
                   omci_ignore_mib_tbl.conf scfg.txt default_scfg.txt; do
            test -f "config-tree/$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "file count: $(find config-tree -type f | wc -l)"

      - name: Build UBIFS image
        run: |
          mkfs.ubifs \
            -r config-tree \
            -m 2048 \
            -e 126976 \
            -c "${{ inputs.max_leb }}" \
            -o ubi_Config.ubifs
          ls -l ubi_Config.ubifs
          echo "size: $(stat -c %s ubi_Config.ubifs) bytes"

      - name: Verify image
        run: |
          # ubireader cannot read a bare UBIFS image, so just sanity-check the
          # superblock magic and report geometry.
          python3 - <<'PY'
          import struct
          data = open('ubi_Config.ubifs', 'rb').read()
          magic = struct.unpack('<I', data[:4])[0]
          print('magic: 0x%08x (expect 0x06101831)' % magic)
          assert magic == 0x06101831, 'not a UBIFS image'
          print('total size: %d bytes' % len(data))
          PY
          echo "--- tree ---"
          find config-tree -type f -printf '%10s  %p\n' | sort -k2

      - uses: actions/upload-artifact@v4
        with:
          name: ubi-config-image
          path: ubi_Config.ubifs
          retention-days: 7
